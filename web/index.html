<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2thamoon</title>
<meta name="description" content="A crypto market sandbox. Turn the knobs, watch it implode. Runs entirely in your browser.">
<meta property="og:title" content="2thamoon">
<meta property="og:description" content="A crypto market sandbox. Turn the knobs, watch it implode.">
<meta property="og:url" content="https://2thamoon.trevorrosato.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css">
<style>
  html, body, #root { height: 100%; margin: 0; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #6b7280; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="boot">Loading the simulator. The first visit downloads Python, so give it a few seconds.</div>
<div id="root"></div>
<script type="module">
  // The same Streamlit app as `streamlit run app.py`, run in the browser by stlite (Pyodide).
  // Sources are copied next to this page at deploy time; see vercel.json.
  import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";

  const sources = [
    "app.py",
    "moonsim/__init__.py",
    "moonsim/amm.py",
    "moonsim/config.py",
    "moonsim/engine.py",
    "moonsim/presets.py",
    "moonsim/story.py",
    "moonsim_app/__init__.py",
    "moonsim_app/charts.py",
    "moonsim_app/main.py",
  ];

  const files = Object.fromEntries(sources.map((path) => [path, { url: `./src/${path}` }]));
  const root = document.getElementById("root");
  mount({
    requirements: ["plotly"],
    entrypoint: "app.py",
    files,
    streamlitConfig: { "client.toolbarMode": "viewer" },
  }, root);

  const boot = document.getElementById("boot");
  new MutationObserver((_, observer) => {
    if (root.childElementCount) { boot.remove(); observer.disconnect(); }
  }).observe(root, { childList: true });
</script>
</body>
</html>
