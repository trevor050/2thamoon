name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install app and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: App boots from a fresh install
        run: |
          timeout 40 streamlit run app.py --server.headless true --server.port 8599 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8599/_stcore/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "streamlit never became healthy"; exit 1
